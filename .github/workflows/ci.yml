name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Development checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install Python
        run: uv python install
      - name: Install locked development environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check types
        run: uv run --locked mypy
      - name: Test
        run: uv run --locked pytest
      - name: Build wheel and source distribution
        run: uv build
      - name: Check built wheel in an isolated environment
        run: |
          uv run --isolated --no-project --python 3.14.10 --with dist/*.whl python -I -c "from vulnproof.models import EvidenceBundle; from vulnproof.static.analysis import fixture_manifest; from vulnproof.correlation import policy; from vulnproof.planning import planning_catalog; from vulnproof.runner import runner_approval; print(EvidenceBundle.model_json_schema()['title']); print(len(fixture_manifest().fixtures)); print(policy().rule_sha256); print(planning_catalog().id); print(runner_approval().profile)"
          uv run --isolated --no-project --python 3.14.10 --with dist/*.whl vulnproof --help
          uv run --isolated --no-project --python 3.14.10 --with dist/*.whl vulnproof report --help
          uv run --isolated --no-project --python 3.14.10 --with dist/*.whl python -I -c "from vulnproof.reporting import ReportDocument; print(ReportDocument.model_json_schema()['title'])"

  codeql-analysis:
    name: CodeQL analysis integration
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install Python and locked tools
        run: |
          uv python install
          uv sync --locked
      - name: Prepare checksum-verified CodeQL bundle
        run: uv run --locked python scripts/prepare_codeql.py
      - name: Analyze the two approved fixture captures
        run: uv run --locked python scripts/check_codeql_analysis.py
      - name: Retain bounded analysis diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codeql-analysis-diagnostics
          path: .cache/analysis-check/*/*-analysis/diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

  controlled-scan:
    name: Controlled scanner integration
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Prepare pinned tools
        run: |
          uv python install
          uv sync --locked
          uv run --locked python scripts/prepare_semgrep.py
          uv run --locked python scripts/prepare_codeql.py
      - name: Verify repository scans with the prepared Semgrep installation
        env:
          VULNPROOF_TEST_SEMGREP: ${{ github.workspace }}/.cache/semgrep/1.184.0
          VULNPROOF_TEST_CODEQL: ${{ github.workspace }}/.cache/codeql/2.27.3/codeql
        run: uv run --locked pytest tests/test_repository_scan.py tests/test_repository_investigation.py tests/test_repository_correlation.py tests/test_repository_discovery.py
      - name: Verify real scanner and static path association
        run: uv run --locked python scripts/check_controlled_scan.py
      - name: Retain bounded diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controlled-scan-diagnostics
          path: |
            .cache/controlled-scan-check/*/*-scan/diagnostics/
            .cache/controlled-scan-check/*/*-scan/scan.json
            .cache/controlled-scan-check/*/*-analysis/diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

  cwe22-validation:
    name: CWE-22 dynamic validation
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Prepare pinned analysis tools
        run: |
          uv python install
          uv sync --locked
          uv run --locked python scripts/prepare_semgrep.py
          uv run --locked python scripts/prepare_codeql.py
      - name: Prepare reviewed validation images
        run: |
          mkdir -p .cache
          uv run --locked python scripts/prepare_validation_images.py --docker-socket /var/run/docker.sock --output .cache/validation-preparation
      - name: Check real finding-to-result workflow and patched driver
        run: uv run --locked python scripts/check_cwe22_validation.py --docker-socket /var/run/docker.sock --preparation .cache/validation-preparation/prepared-images.json
      - name: Retain bounded validation diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cwe22-validation-diagnostics
          path: |
            .cache/validation-check/*/report/
            .cache/validation-check/*/vulnerable/
            .cache/validation-check/*/unverified-source/
            .cache/validation-check/*/patched-driver-only/attempt.json
            .cache/validation-check/*/patched-driver-only/diagnostics/
            .cache/validation-check/*/scan/diagnostics/
            .cache/validation-check/*/analysis/diagnostics/
            .cache/validation-preparation/diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

  docker-runner:
    name: Docker runner integration
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install locked development tools
        run: |
          uv python install
          uv sync --locked
      - name: Prepare reviewed diagnostic images
        run: |
          mkdir -p .cache
          uv run --locked python scripts/prepare_runner_images.py --docker-socket /var/run/docker.sock --output .cache/runner-preparation
      - name: Verify real runner restrictions and cleanup
        run: uv run --locked pytest tests/integration/test_runner_docker.py --run-runner-docker --runner-docker-socket /var/run/docker.sock --runner-prepared-images .cache/runner-preparation/prepared-images.json
      - name: Retain bounded runner diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-diagnostics
          path: |
            .cache/runner-check/
            .cache/runner-preparation/diagnostics/
            .cache/runner-preparation/prepared-images.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

  cwe22-feasibility:
    name: CWE-22 feasibility
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install Python and locked tools
        run: |
          uv python install
          uv sync --locked
      - name: Check fixture dependency lock and Docker export
        run: |
          mkdir -p .cache
          uv lock --project fixtures/cwe22 --check
          uv export --project fixtures/cwe22 --locked --no-dev --no-emit-project --no-header --format requirements-txt --output-file .cache/fixture-requirements.lock
          diff -u fixtures/cwe22/requirements.lock .cache/fixture-requirements.lock
      - name: Prepare checksum-verified CodeQL bundle
        run: uv run --locked python scripts/prepare_codeql.py
      - name: Run static and container experiments
        run: uv run --locked python scripts/feasibility.py all
      - name: Retain bounded diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cwe22-feasibility-diagnostics
          path: .cache/feasibility/*/diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3

  repository-preparation:
    name: Repository image preparation
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install locked development environment
        run: |
          uv python install
          uv sync --locked
      - name: Prepare generated applications without starting them
        env:
          VULNPROOF_PREPARATION_DOCKER_SOCKET: /var/run/docker.sock
          VULNPROOF_PREPARATION_PLATFORM: linux/amd64
        run: uv run --locked pytest tests/test_repository_preparation.py -q

  repository-controls:
    name: Repository application controls
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install locked tools and acquire pinned test wheels
        run: |
          uv python install
          uv sync --locked
          mkdir -p .cache/repository-control-wheels
          uv run --isolated --no-project --python 3.14.10 --with pip==26.2.2 python -m pip download --require-hashes --only-binary=:all: -r fixtures/cwe22/requirements.lock --dest .cache/repository-control-wheels
      - name: Run restricted controls on generated applications
        env:
          VULNPROOF_CONTROL_DOCKER_SOCKET: /var/run/docker.sock
          VULNPROOF_CONTROL_WHEELHOUSE: .cache/repository-control-wheels
          VULNPROOF_CONTROL_PLATFORM: linux/amd64
        run: uv run --locked pytest tests/integration/test_repository_controls_docker.py -q

  repository-validation:
    name: Repository validation pipeline
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Prepare pinned tools and test dependencies
        run: |
          uv python install
          uv sync --locked
          uv run --locked python scripts/prepare_semgrep.py
          uv run --locked python scripts/prepare_codeql.py
          mkdir -p .cache/repository-control-wheels
          uv run --isolated --no-project --python 3.14.10 --with pip==26.2.2 python -m pip download --require-hashes --only-binary=:all: -r fixtures/cwe22/requirements.lock --dest .cache/repository-control-wheels
      - name: Verify actual findings and bounded container observations
        env:
          VULNPROOF_TEST_SEMGREP: .cache/semgrep/1.184.0
          VULNPROOF_TEST_CODEQL: .cache/codeql/2.27.3/codeql
          VULNPROOF_CONTROL_DOCKER_SOCKET: /var/run/docker.sock
          VULNPROOF_CONTROL_WHEELHOUSE: .cache/repository-control-wheels
          VULNPROOF_CONTROL_PLATFORM: linux/amd64
        run: uv run --locked pytest tests/integration/test_repository_validation_docker.py -q
