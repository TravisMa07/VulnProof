name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Development checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install Python
        run: uv python install
      - name: Install locked development environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check types
        run: uv run --locked mypy
      - name: Test
        run: uv run --locked pytest
      - name: Build wheel and source distribution
        run: uv build
      - name: Check built wheel in an isolated environment
        run: >-
          uv run --isolated --no-project --python 3.14.10 --with dist/*.whl
          python -I -c "import vulnproof; from importlib.metadata import version; print(version('vulnproof'))"

  cwe22-feasibility:
    name: CWE-22 feasibility
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install Python and locked tools
        run: |
          uv python install
          uv sync --locked
      - name: Check fixture dependency lock and Docker export
        run: |
          mkdir -p .cache
          uv lock --project fixtures/cwe22 --check
          uv export --project fixtures/cwe22 --locked --no-dev --no-emit-project --no-header --format requirements-txt --output-file .cache/fixture-requirements.lock
          diff -u fixtures/cwe22/requirements.lock .cache/fixture-requirements.lock
      - name: Prepare checksum-verified CodeQL bundle
        run: uv run --locked python scripts/prepare_codeql.py
      - name: Run static and container experiments
        run: uv run --locked python scripts/feasibility.py all
      - name: Retain bounded diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cwe22-feasibility-diagnostics
          path: .cache/feasibility/*/diagnostics/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 3
