name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Development checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.6"
          enable-cache: false
      - name: Install Python
        run: uv python install
      - name: Install locked development environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run --locked ruff format --check .
      - name: Lint
        run: uv run --locked ruff check .
      - name: Check types
        run: uv run --locked mypy
      - name: Test
        run: uv run --locked pytest
      - name: Build wheel and source distribution
        run: uv build
      - name: Check built wheel in an isolated environment
        run: >-
          uv run --isolated --no-project --python 3.14.10 --with dist/*.whl
          python -I -c "import vulnproof; from importlib.metadata import version; print(version('vulnproof'))"
