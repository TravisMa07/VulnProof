[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "vulnproof"
version = "0.0.0"
description = "A local-first exploitability validation platform under development."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
required-version = "==0.13.6"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnproof"]
exclude = ["**/.gitkeep"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/pyproject.toml", "/README.md", "/CONTRIBUTING.md", "/uv.lock"]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
