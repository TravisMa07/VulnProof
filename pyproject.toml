[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "vulnproof"
version = "0.0.0"
description = "A local-first exploitability validation platform under development."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = ["pydantic==2.14.2"]

[project.scripts]
vulnproof = "vulnproof.cli:main"

[dependency-groups]
dev = [
    "flask==3.1.3", # Type-check fixture code; not a VulnProof runtime dependency.
    "mypy==2.4.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[tool.uv]
required-version = "==0.13.6"

[tool.hatch.build.targets.wheel]
packages = ["src/vulnproof"]
exclude = ["**/.gitkeep"]

[tool.hatch.build.targets.sdist]
include = [
    "/src", "/tests", "/scripts", "/fixtures/cwe22", "/fixtures/runner", "/docs", "/schemas",
    "/pyproject.toml", "/.python-version", "/README.md", "/CONTRIBUTING.md", "/uv.lock",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests", "scripts", "fixtures"]
explicit_package_bases = true
mypy_path = ["src", "."]
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_typed = true
init_forbid_extra = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
markers = ["runner_docker: explicit integration checks requiring approved Docker images"]
