rules:
  - id: vulnproof.repository.request-file-read
    languages: [python]
    mode: taint
    message: A request query value reaches the path argument of open.
    severity: WARNING
    pattern-sources:
      - pattern: request.args.get(...)
    pattern-sinks:
      - patterns:
          - pattern: open($PATH, ...)
          - focus-metavariable: $PATH
  - id: vulnproof.repository.query-eval
    languages: [javascript]
    message: A request query property is evaluated as JavaScript.
    severity: WARNING
    pattern: eval($REQ.query.$FIELD)

  - id: vulnproof.repository.route-file-read
    languages: [python]
    mode: taint
    message: A route parameter reaches the path argument of open.
    severity: WARNING
    pattern-sources:
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.get($ROUTE)
                  def $FUNC(...):
                    ...
              - pattern-inside: |
                  @$APP.route($ROUTE, ...)
                  def $FUNC(...):
                    ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: .*<path:.*
          - pattern: |
              def $FUNC(..., $PARAM, ...):
                ...
          - focus-metavariable: $PARAM
    pattern-sinks:
      - patterns:
          - pattern: open($PATH, ...)
          - focus-metavariable: $PATH

  - id: vulnproof.repository.send-file
    languages: [python]
    mode: taint
    message: Request input reaches the file-serving path argument.
    severity: WARNING
    pattern-sources:
      - pattern: request.args.get(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.get($ROUTE)
                  def $FUNC(...):
                    ...
              - pattern-inside: |
                  @$APP.route($ROUTE, ...)
                  def $FUNC(...):
                    ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: .*<path:.*
          - pattern: |
              def $FUNC(..., $PARAM, ...):
                ...
          - focus-metavariable: $PARAM
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: flask.send_file($PATH, ...)
              - pattern: flask.send_file(path_or_file=$PATH, ...)
          - focus-metavariable: $PATH

  - id: vulnproof.repository.send-from-directory
    languages: [python]
    mode: taint
    message: Request input reaches the file-serving path argument.
    severity: WARNING
    pattern-sources:
      - pattern: request.args.get(...)
      - patterns:
          - pattern-either:
              - pattern-inside: |
                  @$APP.get($ROUTE)
                  def $FUNC(...):
                    ...
              - pattern-inside: |
                  @$APP.route($ROUTE, ...)
                  def $FUNC(...):
                    ...
          - metavariable-regex:
              metavariable: $ROUTE
              regex: .*<path:.*
          - pattern: |
              def $FUNC(..., $PARAM, ...):
                ...
          - focus-metavariable: $PARAM
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: flask.send_from_directory($DIR, $PATH, ...)
              - pattern: flask.send_from_directory(..., path=$PATH, ...)
          - focus-metavariable: $PATH

  - id: vulnproof.repository.command-injection
    languages: [python]
    mode: taint
    message: Request input reaches a supported command sink.
    severity: WARNING
    pattern-sources:
      - pattern: request.args.get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: subprocess.check_output($VALUE, shell=True, ...)
              - pattern: subprocess.run($VALUE, shell=True, ...)
              - pattern: os.system($VALUE)
          - focus-metavariable: $VALUE

  - id: vulnproof.repository.sql-injection
    languages: [python]
    mode: taint
    message: Request input reaches a supported sql sink.
    severity: WARNING
    pattern-sources:
      - pattern: request.args.get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.execute($VALUE, ...)
          - focus-metavariable: $VALUE

  - id: vulnproof.repository.template-injection
    languages: [python]
    mode: taint
    message: Request input reaches a supported template sink.
    severity: WARNING
    pattern-sources:
      - pattern: request.args.get(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: flask.render_template_string($VALUE, ...)
          - focus-metavariable: $VALUE
